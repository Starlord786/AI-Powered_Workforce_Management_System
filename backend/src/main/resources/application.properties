spring.application.name=workforce
server.port=8080

# Secrets are NOT stored here. Set them as environment variables, or put them in
# backend/.env (git-ignored). See backend/.env.example.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/workforce_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HS256 key: must be at least 32 characters. No default on purpose - app refuses to start without it.
app.jwt.secret=${JWT_SECRET}

ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Demo users are created only when SEED_DEMO_USERS=true (first run on an empty DB).
app.seed.enabled=${SEED_DEMO_USERS:false}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.hr-password=${SEED_HR_PASSWORD:}
app.seed.manager-password=${SEED_MANAGER_PASSWORD:}
app.seed.employee-password=${SEED_EMPLOYEE_PASSWORD:}
